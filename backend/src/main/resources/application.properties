# =====================================================
# APPLICATION
# =====================================================

spring.application.name=ticket-booking-backend

server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ticket_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# =====================================================
# JSON / TIMEZONE
# =====================================================

spring.jackson.time-zone=Asia/Kolkata


# =====================================================
# GMAIL SMTP
# =====================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true


# =====================================================
# CONNECTION POOL
# =====================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000
# Frontend URL used in waitlist offer emails
app.frontend.url=http://localhost:5173